<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Tareas Académicas</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- VISTA 1: AUTENTICACIÓN (LOGIN / REGISTRO) -->
    <main id="auth-section" class="container auth-container">
        <div class="card">
            <h1>Gestor de Tareas</h1>
            <p class="subtitle">Organiza tus entregas de la facultad</p>

            <div class="tabs">
                <button id="tab-login" class="tab active" type="button">Iniciar Sesión</button>
                <button id="tab-register" class="tab" type="button">Registrarse</button>
            </div>

            <!-- Banner de avisos y errores -->
            <div id="auth-alert" class="alert hidden" role="alert"></div>

            <!-- Formulario Login -->
            <form id="login-form" novalidate>
                <div class="form-group">
                    <label for="login-email">Correo institucional</label>
                    <input type="email" id="login-email" placeholder="osmar@uv.mx" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Contraseña</label>
                    <input type="password" id="login-password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Entrar</button>
            </form>

            <!-- Formulario Registro -->
            <form id="register-form" class="hidden" novalidate>
                <div class="form-group">
                    <label for="reg-nombre">Nombre</label>
                    <input type="text" id="reg-nombre" placeholder="Osmar" required>
                </div>
                <div class="form-group">
                    <label for="reg-email">Correo institucional</label>
                    <input type="email" id="reg-email" placeholder="osmar@uv.mx" required>
                </div>
                <div class="form-group">
                    <label for="reg-password">Contraseña</label>
                    <input type="password" id="reg-password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Crear Cuenta</button>
            </form>
        </div>
    </main>

    <!-- VISTA 2: DASHBOARD DE TAREAS -->
    <div id="dashboard-section" class="hidden">
        <header class="navbar">
            <div class="nav-brand">Gestor de Tareas</div>
            <div class="nav-user">
                <span id="user-greeting">Hola, Usuario</span>
                <button id="btn-logout" class="btn btn-outline">Cerrar sesión</button>
            </div>
        </header>

        <main class="container dashboard-grid">
            <section class="card">
                <h2>Nueva Tarea</h2>
                <form id="tarea-form">
                    <div class="form-group">
                        <label for="materia">Materia</label>
                        <input type="text" id="materia" placeholder="Ej. Desarrollo Web" required>
                    </div>
                    <div class="form-group">
                        <label for="titulo">Título de la actividad</label>
                        <input type="text" id="titulo" placeholder="Ej. Entregable 3 Frontend" required>
                    </div>
                    <div class="form-group">
                        <label for="fecha_limite">Fecha límite</label>
                        <input type="datetime-local" id="fecha_limite" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">Agregar Tarea</button>
                </form>
            </section>

            <section class="card">
                <div class="list-header">
                    <h2>Mis Tareas</h2>
                    <select id="filtro-estado">
                        <option value="todas">Todas</option>
                        <option value="pendiente">Pendientes</option>
                        <option value="completada">Completadas</option>
                    </select>
                </div>
                <div id="lista-tareas" class="tareas-list"></div>
            </section>
        </main>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
